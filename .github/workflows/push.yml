name: push, pull & kics
on:
    pull_request:
        branches:
        - main
    push:
        branches:
        - main

permissions:
      id-token: write #OIDC
      contents: read #required for actions/checkout*

env:
  TERRAFORM_VERSION: 1.9.2
  TERRAFORM_WORKING_DIR: 'src'

jobs:
  kics:
    name: "Run Kics scan on Terraform code"
    uses: ./.github/workflows/terrakics.yml #'uses' & 'run' = same thing
    with:
        # Enabling Comments will add a comment to a PR, but these do no exist in Push events and will throw an error. ##*
        ENABLE_COMMENTS: true #*
        WORKING_DIRECTORY: './'

  jobs:
    name: "Terraform Init, Validate, Plan & Apply"
    needs: [ kics ]
    if: github.event_name == 'push' 
    #If the *initial/first* "if" condition differs from the "on" condition, the job will be skipped.
    #Because a job is within a workflow; it obeys the "on" first
    #This particular job will run on a pull request, as well as the workflow.
    #each job(s) is INDEPENDENT of one another *unless it has '[needs]'

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

    steps:
      - name: 'Checkout repo'
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: true

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
  
      - name: Terraform Init
        id: init
        run: terraform init 

      - name: Terraform Validate
        id: validate
        run: terraform validate 

      - name: Terraform Plan
        id: plan
        run: | #
         terraform plan
         terraform show tfplan
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        continue-on-error: true